<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2e3cf"/><stop offset="1" stop-color="#faf4ec"/></linearGradient>
    <radialGradient id="naru" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#f6e2b8"/><stop offset="0.55" stop-color="#d9a866"/><stop offset="1" stop-color="#a8713a"/></radialGradient>
    <radialGradient id="plate" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#efe6d8"/></radialGradient>
    <pattern id="flakes" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M4 6l5 2M14 3l3 4M8 15l5-1M17 14l2 5M2 19l4-2" stroke="#fff7e6" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- plate -->
  <ellipse cx="400" cy="470" rx="270" ry="92" fill="#8a5a2b" opacity="0.18" filter="url(#soft)"/>
  <ellipse cx="400" cy="450" rx="265" ry="95" fill="url(#plate)" stroke="#e2d4bf" stroke-width="3"/>
  <ellipse cx="400" cy="445" rx="200" ry="65" fill="none" stroke="#e8dccb" stroke-width="2"/>

  <!-- naru: back row, then front row -->
  <g>
    <circle cx="315" cy="365" r="62" fill="url(#naru)"/><circle cx="315" cy="365" r="62" fill="url(#flakes)"/>
    <circle cx="485" cy="365" r="62" fill="url(#naru)"/><circle cx="485" cy="365" r="62" fill="url(#flakes)"/>
    <circle cx="400" cy="335" r="64" fill="url(#naru)"/><circle cx="400" cy="335" r="64" fill="url(#flakes)"/>
    <circle cx="350" cy="430" r="66" fill="url(#naru)"/><circle cx="350" cy="430" r="66" fill="url(#flakes)"/>
    <circle cx="455" cy="432" r="66" fill="url(#naru)"/><circle cx="455" cy="432" r="66" fill="url(#flakes)"/>
  </g>

  <!-- coconut half -->
  <g transform="translate(690 480) scale(0.8)">
    <circle r="58" fill="#6b4423"/>
    <circle r="44" fill="#fffaf0"/>
    <circle r="44" fill="none" stroke="#efe3cc" stroke-width="4"/>
  </g>

  <!-- coming soon -->
  <rect x="100" y="572" width="600" height="116" rx="58" fill="#173a16"/>
  <text x="400" y="652" font-family="'Noto Sans Bengali', 'Hind Siliguri', 'Kohinoor Bangla', sans-serif" font-size="64" font-weight="700" fill="#faf4ec" text-anchor="middle">ছবি শীঘ্রই আসছে</text>
  <text x="400" y="760" font-family="Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#173a16" fill-opacity="0.75" text-anchor="middle" letter-spacing="3">PHOTO COMING SOON</text>
</svg>
